<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Decorative orbs -->
  <ellipse cx="200" cy="80" rx="380" ry="200" fill="url(#orb1)"/>
  <ellipse cx="1000" cy="220" rx="400" ry="200" fill="url(#orb2)"/>

  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#8b5cf6" stroke-width="1" fill="none">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="300" fill="url(#grid)"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#grad1)"/>

  <!-- Logo mark (mini otter) -->
  <g transform="translate(80, 90) scale(0.75)">
    <circle cx="62" cy="62" r="18" fill="#06b6d4"/>
    <circle cx="138" cy="62" r="18" fill="#06b6d4"/>
    <circle cx="62" cy="62" r="9" fill="#05070d"/>
    <circle cx="138" cy="62" r="9" fill="#05070d"/>
    <ellipse cx="100" cy="110" rx="62" ry="62" fill="url(#grad1)"/>
    <circle cx="80" cy="102" r="9" fill="#05070d"/>
    <circle cx="120" cy="102" r="9" fill="#05070d"/>
    <circle cx="82.5" cy="99.5" r="3" fill="#ffffff"/>
    <circle cx="122.5" cy="99.5" r="3" fill="#ffffff"/>
    <ellipse cx="100" cy="132" rx="22" ry="16" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="100" cy="124" rx="6.5" ry="4.5" fill="#05070d"/>
  </g>

  <!-- Main title -->
  <text x="280" y="140" font-family="JetBrains Mono, Consolas, monospace" font-size="58" font-weight="900" fill="url(#gradText)" filter="url(#glow)" letter-spacing="2">HAMED PANEL | پـنـل حـامـد</text>

  <!-- Subtitle -->
  <text x="282" y="180" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="600" fill="#7c88a6" letter-spacing="6">V2RAY · XRAY · TELEMETRY GATEWAY</text>

  <!-- Version chip -->
  <g transform="translate(285, 205)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
    <text x="90" y="20" font-family="JetBrains Mono, monospace" font-size="13" font-weight="800" fill="#c4b5fd" text-anchor="middle" letter-spacing="1">SECURE · DESIGN</text>
  </g>

  <!-- Developer chip -->
  <g transform="translate(480, 205)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#ec4899" opacity="0.15" stroke="#ec4899" stroke-width="1"/>
    <text x="110" y="20" font-family="JetBrains Mono, monospace" font-size="13" font-weight="800" fill="#fbcfe8" text-anchor="middle" letter-spacing="1">DEV · THE SAZ</text>
  </g>

  <!-- Bottom right decoration -->
  <g opacity="0.7">
    <circle cx="1080" cy="80" r="4" fill="#06b6d4"/>
    <circle cx="1120" cy="120" r="3" fill="#8b5cf6"/>
    <circle cx="1100" cy="180" r="5" fill="#ec4899"/>
    <circle cx="1150" cy="230" r="3" fill="#06b6d4"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="297" width="1200" height="3" fill="url(#grad1)"/>
</svg>
